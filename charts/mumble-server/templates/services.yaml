apiVersion: v1
kind: Service
metadata:
  name: {{ include "mumble-server.fullname" . }}
  labels:
    {{- include "mumble-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mumble-tcp
      protocol: TCP
      name: mumble-tcp
    - port: {{ .Values.service.port }}
      targetPort: mumble-udp
      protocol: UDP
      name: mumble-udp
  selector:
    {{- include "mumble-server.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mumble-server.fullname" . }}-0
  labels:
    {{- include "mumble-server.labels" . | nindent 4 }}
    {{- with .Values.service.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.metadata.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mumble-tcp
      protocol: TCP
      name: mumble-tcp
    - port: {{ .Values.service.port }}
      targetPort: mumble-udp
      protocol: UDP
      name: mumble-udp
  selector:
    statefulset.kubernetes.io/pod-name: {{ include "mumble-server.fullname" . }}-0
