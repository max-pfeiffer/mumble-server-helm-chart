apiVersion: v1
kind: Service
metadata:
  name: {{ include "mumble-server.fullname" . }}
  labels:
    {{- include "mumble-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mumble-tcp
      protocol: TCP
      name: mumble-tcp
    - port: {{ .Values.service.port }}
      targetPort: mumble-udp
      protocol: UDP
      name: mumble-udp
  selector:
    {{- include "mumble-server.selectorLabels" . | nindent 4 }}
